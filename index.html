<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>クイズ選択 → 四択テスト</title>
  <style>
    :root{
      --bg:#0b1020; --card:#121a33; --text:#e9ecf5; --muted:#aab3d6;
      --accent:#6aa6ff; --good:#36d399; --bad:#fb7185; --line:rgba(255,255,255,.10);
      --chip:rgba(255,255,255,.06);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
      background:linear-gradient(160deg,#0b1020,#0f1730); color:var(--text);
    }
    a{ color:inherit; }
    .wrap{ max-width: 1100px; margin:0 auto; padding: 22px 14px 56px; }
    header{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
    h1{ margin:0; font-size:22px; letter-spacing:.02em; }
    .meta{ color:var(--muted); font-size:13px; }

    .card{
      background:rgba(18,26,51,.92); border:1px solid var(--line); border-radius:18px;
      padding:16px; box-shadow:0 16px 30px rgba(0,0,0,.28);
    }
    button{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px; border-radius:12px;
      cursor:pointer; font-weight:800;
    }
    button.primary{ background:rgba(106,166,255,.18); border-color:rgba(106,166,255,.35); }
    button.danger{ background:rgba(251,113,133,.12); border-color:rgba(251,113,133,.35); }
    button:disabled{ opacity:.5; cursor:not-allowed; }

    /* ====== Home (quiz chooser) ====== */
    #home{ display:block; }
    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
    }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px){ .grid{ grid-template-columns: 1fr; } }

    .qcard{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      overflow:hidden;
      display:flex; flex-direction:column;
      min-height: 330px;
    }
    .thumb{
      width:100%;
      aspect-ratio: 16/9;
      object-fit:cover;
      background:rgba(255,255,255,.06);
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .qbody{ padding:14px; display:flex; flex-direction:column; gap:10px; flex:1; }
    .qtitle{ font-size:16px; font-weight:900; margin:0; }
    .qdesc{ margin:0; color:var(--muted); font-size:13px; line-height:1.6; flex:1; }
    .qmeta{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{ font-size:12px; padding:6px 10px; border-radius:999px; background:var(--chip); border:1px solid rgba(255,255,255,.10); color:var(--muted); }
    .qactions{ display:flex; gap:10px; flex-wrap:wrap; }

    /* ====== App (quiz screen) ====== */
    #app{ display:none; }
    .layout{ display:grid; grid-template-columns: 1fr 320px; gap:12px; align-items:start; }
    @media (max-width: 980px){ .layout{ grid-template-columns: 1fr; } }
    .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    label.toggle{ display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; user-select:none; }
    input[type="checkbox"]{ transform: translateY(1px); }
    .progress{ color:var(--muted); font-size:13px; }
    .timer{ font-variant-numeric: tabular-nums; font-weight:800; }
    .timer.warn{ color: #ffd18b; }
    .timer.dead{ color: var(--bad); }

    .q{ font-size:18px; line-height:1.55; margin: 10px 0 14px; }
    .choices{ display:grid; gap:10px; }
    .choice{
      display:flex; gap:10px; align-items:flex-start;
      padding:12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      cursor:pointer; user-select:none;
    }
    .choice:hover{ border-color:rgba(106,166,255,.45); background:rgba(106,166,255,.08); }
    .badge{
      width:26px; height:26px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
      background:rgba(106,166,255,.18); border:1px solid rgba(106,166,255,.25); font-weight:900;
    }
    .choice.selected{ border-color:rgba(106,166,255,.55); background:rgba(106,166,255,.10); }
    .choice.disabled{ cursor:default; opacity:.95; }
    .choice.correct{ border-color:rgba(54,211,153,.60); background:rgba(54,211,153,.10); }
    .choice.wrong{ border-color:rgba(251,113,133,.65); background:rgba(251,113,133,.10); }
    .choice.correct .badge{ background:rgba(54,211,153,.18); border-color:rgba(54,211,153,.35); }
    .choice.wrong .badge{ background:rgba(251,113,133,.18); border-color:rgba(251,113,133,.35); }

    .hint{
      margin-top:12px; padding:12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.04);
      color:var(--muted); font-size:13px; line-height:1.6; display:none;
      white-space:pre-wrap;
    }
    .btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

    .sideTitle{ margin:0 0 10px; font-size:14px; color:var(--muted); }
    .panel{ display:grid; gap:10px; }
    .box{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:16px;
      padding:12px;
    }
    .gridNav{ display:grid; grid-template-columns: repeat(8, 1fr); gap:8px; }
    @media (max-width: 980px){ .gridNav{ grid-template-columns: repeat(10, 1fr); } }
    .navBtn{
      padding:8px 0; border-radius:10px; border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04); color:var(--text);
      font-weight:900; cursor:pointer; user-select:none;
      font-variant-numeric: tabular-nums;
    }
    .navBtn.current{ border-color:rgba(106,166,255,.55); background:rgba(106,166,255,.10); }
    .navBtn.answered{ border-color:rgba(54,211,153,.40); }
    .navBtn.review{ border-color:rgba(255,209,139,.55); background:rgba(255,209,139,.08); }

    .chipRow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .result{ display:none; margin-top:14px; padding:16px; border-radius:16px; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.04); }
    .result h2{ margin:0 0 6px; font-size:18px; }
    .pillbar{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .pill{ font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.12); color:var(--muted); }
    .pill.ok{ border-color:rgba(54,211,153,.45); color:var(--good); background:rgba(54,211,153,.08); }
    .pill.ng{ border-color:rgba(251,113,133,.50); color:var(--bad); background:rgba(251,113,133,.08); }

    .rlist{ margin:12px 0 0; padding:0; list-style:none; display:grid; gap:10px; }
    .ritem{ border-radius:14px; border:1px solid rgba(255,255,255,.10); background:rgba(0,0,0,.14); padding:12px; }
    .rhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .rstatus{ font-weight:900; }
    .rstatus.ok{ color:var(--good); }
    .rstatus.ng{ color:var(--bad); }
    .rmeta{ color:var(--muted); font-size:12px; }
    .rexp{ margin-top:8px; color:var(--muted); font-size:13px; line-height:1.65; white-space:pre-wrap; }

    .error{
      border:1px dashed rgba(255,255,255,.18);
      padding:12px; border-radius:16px; color:#ffd1d1; line-height:1.7;
      background:rgba(255,255,255,.04);
    }
    code{ color:#d7dcff; }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1 id="pageTitle">クイズを選択</h1>
      <div class="meta" id="meta">—</div>
    </header>

    <!-- ===== Home (quiz chooser) ===== -->
    <section id="home" class="card">
      <div class="row" style="margin-bottom:12px;">
        <div class="meta">画像カードからクイズを選んで開始できます。</div>
        <div class="meta">※画像はリポジトリの <code>assets/</code> に置くのがおすすめ</div>
      </div>
      <div class="grid" id="quizGrid"></div>
    </section>

    <!-- ===== App (quiz) ===== -->
    <section id="app">
      <div class="layout">
        <div class="card" id="mainCard">
          <div class="row">
            <div class="progress" id="progress">—</div>
            <div class="controls">
              <label class="toggle"><input type="checkbox" id="shuffleToggle" checked> 問題シャッフル</label>
              <label class="toggle"><input type="checkbox" id="instantToggle"> 即時判定＆解説</label>
              <label class="toggle"><input type="checkbox" id="timerToggle"> タイマー</label>
            </div>
          </div>

          <div class="row" style="margin-top:6px;">
            <div class="meta">
              出題数：
              <select id="countSelect">
                <option value="5">5問</option>
                <option value="10">10問</option>
                <option value="20" selected>20問</option>
                <option value="30">30問</option>
                <option value="50">50問</option>
                <option value="all">全問</option>
              </select>
              ／ 合格ライン：
              <select id="passSelect">
                <option value="50">50%</option>
                <option value="60">60%</option>
                <option value="70">70%</option>
                <option value="80" selected>80%</option>
                <option value="90">90%</option>
              </select>
              ／ 制限時間（分）：
              <select id="minutesSelect">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15" selected>15</option>
                <option value="30">30</option>
                <option value="45">45</option>
                <option value="60">60</option>
              </select>
            </div>
            <div class="meta">
              残り：<span class="timer" id="timer">—</span>
            </div>
          </div>

          <div class="q" id="question">—</div>
          <div class="choices" id="choices"></div>
          <div class="hint" id="hint"></div>

          <div class="btns">
            <button id="backBtn">← クイズ選択へ戻る</button>
            <button id="prevBtn">← 前へ</button>
            <button class="primary" id="nextBtn">次へ →</button>
            <button id="markBtn">見直しフラグ</button>
            <button class="danger" id="submitBtn">提出する</button>
            <button id="restartBtn">最初から（再生成）</button>
          </div>

          <div class="result" id="result"></div>
        </div>

        <div class="card">
          <p class="sideTitle">回答状況</p>
          <div class="panel">
            <div class="box">
              <div class="gridNav" id="navGrid"></div>
              <div class="chipRow" id="chips"></div>
              <div class="meta" style="margin-top:10px;">
                番号クリックでジャンプ／見直しフラグは提出前のチェック用です。
              </div>
            </div>
            <div class="box">
              <div class="meta">
                シート列：<code>id, question, A, B, C, D, answer, explanation</code><br>
                answer：<code>A/B/C/D</code>（または<code>0-3</code>）対応
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
/* =========================
  1) ここに「クイズ一覧」を追加
========================= */
const QUIZZES = [
  {
    id: "sample",
    title: "消費者行動論　第二回四択問題",
    desc: "授業内容の確認テスト",
    image: "assets/https://github.com/subarubrz200ps/quizsite/blob/main/assets/ChatGPT%20Image%202025%E5%B9%B412%E6%9C%8818%E6%97%A5%2014_23_55.png", // ← ここは好きな画像に
    csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTZWe82RkSO44S1unqts1URF7bYW6mgscBA3h3Glf8yAiFe15JEZJ_ZXzblg0KGvw-OSpnBu_UG4ax/pubhtml",
    defaultCount: 20,
    defaultPass: 80,
    defaultMinutes: 15
  },

  // 例）別クイズを増やすときはこの形で追加
  // {
  //   id: "russia",
  //   title: "ロシア政治史クイズ",
  //   desc: "授業内容の確認テスト。",
  //   image: "assets/russia.jpg",
  //   csv: "（このクイズ専用のCSV公開リンク）",
  //   defaultCount: 20,
  //   defaultPass: 80,
  //   defaultMinutes: 15
  // },
];

/* =========================
  2) DOM
========================= */
const pageTitle = document.getElementById("pageTitle");
const elMeta = document.getElementById("meta");

const home = document.getElementById("home");
const quizGrid = document.getElementById("quizGrid");

const app = document.getElementById("app");
const elProgress = document.getElementById("progress");
const elQuestion = document.getElementById("question");
const elChoices = document.getElementById("choices");
const elHint = document.getElementById("hint");
const elNavGrid = document.getElementById("navGrid");
const elChips = document.getElementById("chips");
const elResult = document.getElementById("result");
const elTimer = document.getElementById("timer");

const backBtn = document.getElementById("backBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const markBtn = document.getElementById("markBtn");
const submitBtn = document.getElementById("submitBtn");
const restartBtn = document.getElementById("restartBtn");

const shuffleToggle = document.getElementById("shuffleToggle");
const instantToggle = document.getElementById("instantToggle");
const timerToggle = document.getElementById("timerToggle");

const countSelect = document.getElementById("countSelect");
const passSelect = document.getElementById("passSelect");
const minutesSelect = document.getElementById("minutesSelect");

/* =========================
  3) 状態
========================= */
let currentQuiz = null;   // {title, csv, ...}
let bank = [];            // 全問題（選んだクイズのCSV）
let questions = [];       // 今回の出題セット
let idx = 0;
let answers = [];
let reviewed = [];
let revealed = [];
let submitted = false;
let timerId = null;
let endAt = null;

/* =========================
  4) CSV読み込み・正規化
========================= */
function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i=0; i<text.length; i++) {
    const c = text[i], n = text[i+1];
    if (c === '"' && n === '"') { cur += '"'; i++; continue; }
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { row.push(cur); cur=""; continue; }
    if ((c === '\n' || c === '\r') && !inQ) {
      if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
      row = []; cur = "";
      continue;
    }
    cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function normHeader(s){
  return String(s ?? "").trim().replace(/^\uFEFF/,"").replace(/\s+/g,"").toLowerCase();
}
const HEADER_ALIASES = {
  id: ["id","qid","番号","no","no.","問題id","設問id"],
  question: ["question","q","問題","設問","問い","質問","問"],
  a: ["a","選択肢a","選択a","a選択肢"],
  b: ["b","選択肢b","選択b","b選択肢"],
  c: ["c","選択肢c","選択c","c選択肢"],
  d: ["d","選択肢d","選択d","d選択肢"],
  answer: ["answer","正解","解答","答え","解","正答","correct"],
  explanation: ["explanation","解説","説明","理由","補足"]
};
function findCol(headerNorm, keys){
  for (const k of keys) {
    const kk = normHeader(k);
    if (kk in headerNorm) return headerNorm[kk];
  }
  return null;
}
function toAnswerIndex(a) {
  const s = String(a ?? "").trim().toUpperCase();
  if (["A","B","C","D"].includes(s)) return s.charCodeAt(0) - 65;
  const n = Number(s);
  if (!Number.isNaN(n) && n >= 0 && n <= 3) return n;
  throw new Error(`answerが不正（A/B/C/D or 0-3）：${a}`);
}
function normalize(rows) {
  const header = rows.shift();
  const headerNorm = {};
  header.forEach((h,i)=>{ headerNorm[normHeader(h)] = i; });

  const iQ  = findCol(headerNorm, HEADER_ALIASES.question);
  const iA  = findCol(headerNorm, HEADER_ALIASES.a);
  const iB  = findCol(headerNorm, HEADER_ALIASES.b);
  const iC  = findCol(headerNorm, HEADER_ALIASES.c);
  const iD  = findCol(headerNorm, HEADER_ALIASES.d);
  const iAn = findCol(headerNorm, HEADER_ALIASES.answer);
  const iId = findCol(headerNorm, HEADER_ALIASES.id);
  const iEx = findCol(headerNorm, HEADER_ALIASES.explanation);

  if ([iQ,iA,iB,iC,iD,iAn].some(v => v === null)) {
    throw new Error("ヘッダー不足：question(問題), A, B, C, D, answer(正解) が必要です。");
  }

  const data = rows
    .filter(r => r.join("").trim() !== "")
    .map((r, n) => {
      const q = {
        id: iId !== null ? String(r[iId] ?? "").trim() : `row${n+2}`,
        q: String(r[iQ] ?? "").trim(),
        choices: [r[iA], r[iB], r[iC], r[iD]].map(x => String(x ?? "").trim()),
        correct: toAnswerIndex(r[iAn]),
        explanation: iEx !== null ? String(r[iEx] ?? "").trim() : ""
      };
      if (!q.q) throw new Error(`${n+2}行目: 問題文が空です`);
      if (q.choices.some(x => !x)) throw new Error(`${n+2}行目: 選択肢A〜Dのどれかが空です`);
      return q;
    });

  if (data.length === 0) throw new Error("問題が0件です。");
  return data;
}

/* =========================
  5) テスト生成・表示
========================= */
function shuffleArray(a) {
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function label(i){
  return (i === null || i === undefined) ? "—" : String.fromCharCode(65 + i);
}
function escapeHTML(s){
  return String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#39;");
}

function buildTest() {
  const wantShuffle = shuffleToggle.checked;
  const countVal = countSelect.value;

  let pool = [...bank];
  if (wantShuffle) shuffleArray(pool);

  let take;
  if (countVal === "all") take = pool.length;
  else take = Math.min(pool.length, Number(countVal));

  questions = pool.slice(0, take);
  if (!wantShuffle) questions = [...bank].slice(0, take);

  idx = 0;
  answers = Array(questions.length).fill(null);
  reviewed = Array(questions.length).fill(false);
  revealed = Array(questions.length).fill(false);
  submitted = false;
  elResult.style.display = "none";

  setupTimer();
  renderAll();
}

function clearTimer(){
  if (timerId) { clearInterval(timerId); timerId = null; }
  endAt = null;
  elTimer.textContent = "—";
  elTimer.classList.remove("warn","dead");
}
function setupTimer(){
  clearTimer();
  if (!timerToggle.checked) return;

  const minutes = Number(minutesSelect.value);
  endAt = Date.now() + minutes * 60 * 1000;

  tickTimer();
  timerId = setInterval(tickTimer, 250);
}
function tickTimer(){
  if (!endAt) return;
  const left = Math.max(0, endAt - Date.now());
  const totalSec = Math.ceil(left / 1000);
  const mm = String(Math.floor(totalSec / 60)).padStart(2,"0");
  const ss = String(totalSec % 60).padStart(2,"0");
  elTimer.textContent = `${mm}:${ss}`;

  elTimer.classList.toggle("warn", totalSec <= 60 && totalSec > 0);
  elTimer.classList.toggle("dead", totalSec === 0);

  if (totalSec === 0) {
    clearTimer();
    submit(true);
  }
}

function renderAll(){
  elMeta.textContent = `「${currentQuiz?.title ?? ""}」：全${bank.length}問から ${questions.length}問`;
  elProgress.textContent = `Q${idx+1} / ${questions.length}`;
  renderNav();
  renderChips();
  renderQuestion();
}

function renderNav(){
  elNavGrid.innerHTML = "";
  for (let i=0; i<questions.length; i++){
    const b = document.createElement("button");
    b.className = "navBtn";
    b.textContent = String(i+1);

    b.classList.toggle("current", i === idx);
    b.classList.toggle("answered", answers[i] !== null);
    if (reviewed[i]) b.classList.add("review");

    b.addEventListener("click", () => { idx = i; renderAll(); });
    elNavGrid.appendChild(b);
  }
}

function renderChips(){
  const total = questions.length;
  const answeredCount = answers.filter(a => a !== null).length;
  const reviewCount = reviewed.filter(v => v).length;
  const leftCount = total - answeredCount;

  elChips.innerHTML = `
    <span class="chip">回答済み <strong style="color:var(--text)">${answeredCount}</strong> / ${total}</span>
    <span class="chip">未回答 <strong style="color:var(--text)">${leftCount}</strong></span>
    <span class="chip">見直し <strong style="color:var(--text)">${reviewCount}</strong></span>
  `;
}

function renderQuestion(){
  const q = questions[idx];
  elQuestion.textContent = q.q;

  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === questions.length - 1;

  elHint.style.display = "none";
  if (instantToggle.checked && revealed[idx]) {
    const ok = answers[idx] === q.correct;
    elHint.textContent = `${ok ? "✅ 正解！" : "❌ 不正解…"}　${q.explanation || "解説はありません。"}`;
    elHint.style.display = "block";
  }

  elChoices.innerHTML = "";
  q.choices.forEach((text, i) => {
    const div = document.createElement("div");
    div.className = "choice";

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = String.fromCharCode(65+i);

    const t = document.createElement("div");
    t.textContent = text;

    div.appendChild(badge);
    div.appendChild(t);

    const selected = answers[idx];

    const fixed = submitted || (instantToggle.checked && revealed[idx]);

    if (fixed) {
      div.classList.add("disabled");
      if (i === q.correct) div.classList.add("correct");
      if (selected !== null && i === selected && selected !== q.correct) div.classList.add("wrong");
    } else {
      if (selected === i) div.classList.add("selected");
      div.addEventListener("click", () => choose(i));
    }

    elChoices.appendChild(div);
  });
}

function choose(i){
  if (submitted) return;
  answers[idx] = i;
  if (instantToggle.checked) revealed[idx] = true;
  elResult.style.display = "none";
  renderAll();
}

function submit(auto=false){
  if (submitted) return;
  submitted = true;
  clearTimer();

  const unanswered = answers.filter(a => a === null).length;
  if (!auto && unanswered > 0) {
    if (!confirm(`未回答が ${unanswered} 問あります。提出しますか？（未回答は不正解扱い）`)) {
      submitted = false;
      setupTimer();
      renderAll();
      return;
    }
  }
  showResult(auto);
  renderAll();
}

function showResult(auto){
  const pass = Number(passSelect.value);
  const details = questions.map((q, i) => {
    const your = answers[i];
    const ok = (your !== null) && (your === q.correct);
    return { i, q, your, ok };
  });

  const total = questions.length;
  const correctCount = details.filter(d => d.ok).length;
  const pct = total === 0 ? 0 : Math.round((correctCount / total) * 100);
  const passed = pct >= pass;

  const pills = details.map(d => {
    const cls = d.ok ? "pill ok" : "pill ng";
    const mark = d.ok ? "✓" : "×";
    return `<span class="${cls}">Q${d.i+1} ${mark}</span>`;
  }).join("");

  const list = details.map(d => `
    <li class="ritem">
      <div class="rhead">
        <div><strong>Q${d.i+1}：</strong><span class="rstatus ${d.ok?"ok":"ng"}">${d.ok?"正解":"不正解"}</span></div>
        <div class="rmeta">あなた：${label(d.your)} ／ 正解：${label(d.q.correct)}</div>
      </div>
      <div class="rmeta" style="margin-top:6px;">${escapeHTML(d.q.q)}</div>
      <div class="rexp">${escapeHTML(d.q.explanation || "解説はありません。")}</div>
    </li>
  `).join("");

  const wrongQs = details.filter(d => !d.ok).map(d => d.q);

  elResult.innerHTML = `
    <h2>結果：${correctCount} / ${total}（${pct}%） ${passed ? "✅ 合格" : "❌ 不合格"}</h2>
    <div class="meta">${auto ? "※タイマー終了で自動提出しました。" : ""} 合格ライン：${pass}%</div>
    <div class="pillbar">${pills}</div>

    <div class="btns" style="margin-top:14px;">
      <button class="primary" id="retryWrongBtn">間違いだけ復習（${wrongQs.length}問）</button>
      <button id="retryAllBtn">同条件で最初から</button>
    </div>

    <div class="meta" style="margin-top:10px;">全問の解説一覧：</div>
    <ul class="rlist">${list}</ul>
  `;
  elResult.style.display = "block";

  document.getElementById("retryAllBtn").onclick = () => buildTest();
  document.getElementById("retryWrongBtn").onclick = () => {
    if (wrongQs.length === 0) { alert("全問正解です！"); return; }
    questions = wrongQs;
    idx = 0;
    answers = Array(questions.length).fill(null);
    reviewed = Array(questions.length).fill(false);
    revealed = Array(questions.length).fill(false);
    submitted = false;
    elResult.style.display = "none";
    setupTimer();
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

/* =========================
  6) 画面切り替え
========================= */
function showHome(){
  clearTimer();
  pageTitle.textContent = "クイズを選択";
  elMeta.textContent = "—";
  home.style.display = "block";
  app.style.display = "none";
  currentQuiz = null;
}
function showApp(){
  pageTitle.textContent = currentQuiz?.title ?? "四択テスト";
  home.style.display = "none";
  app.style.display = "block";
}

/* =========================
  7) クイズ選択画面の描画
========================= */
function renderHome(){
  quizGrid.innerHTML = "";
  QUIZZES.forEach(qz => {
    const el = document.createElement("div");
    el.className = "qcard";
    el.innerHTML = `
      <img class="thumb" src="${qz.image}" alt="">
      <div class="qbody">
        <p class="qtitle">${escapeHTML(qz.title)}</p>
        <p class="qdesc">${escapeHTML(qz.desc ?? "")}</p>
        <div class="qmeta">
          <span class="chip">出題：<strong style="color:var(--text)">${qz.defaultCount ?? 20}</strong></span>
          <span class="chip">合格：<strong style="color:var(--text)">${qz.defaultPass ?? 80}%</strong></span>
          <span class="chip">時間：<strong style="color:var(--text)">${qz.defaultMinutes ?? 15}分</strong></span>
        </div>
        <div class="qactions">
          <button class="primary" data-id="${qz.id}">このクイズを開始</button>
        </div>
      </div>
    `;
    el.querySelector("button").onclick = () => startQuiz(qz.id);
    quizGrid.appendChild(el);
  });
}

/* =========================
  8) クイズ開始（CSV読み込み）
========================= */
async function startQuiz(quizId){
  const qz = QUIZZES.find(x => x.id === quizId);
  if (!qz) return;

  currentQuiz = qz;

  // デフォルト設定を反映
  countSelect.value = String(qz.defaultCount ?? 20);
  passSelect.value = String(qz.defaultPass ?? 80);
  minutesSelect.value = String(qz.defaultMinutes ?? 15);

  showApp();
  pageTitle.textContent = qz.title;
  elMeta.textContent = "読み込み中…";

  try{
    const res = await fetch(qz.csv, { cache:"no-store", mode:"cors" });
    if(!res.ok) throw new Error(`CSV取得失敗（HTTP ${res.status}）`);
    const csv = await res.text();
    if (csv.trim().startsWith("<!doctype") || csv.includes("<html")) {
      throw new Error("CSVではなくHTMLが返っています。シートの『ウェブに公開（CSV）』を確認してください。");
    }

    const rows = parseCSV(csv);
    bank = normalize(rows);

    buildTest();
  } catch(e){
    elMeta.textContent = "読み込みエラー";
    document.getElementById("mainCard").innerHTML = `
      <div class="error">
        <div style="font-weight:900;">読み込みエラー</div>
        <div style="margin-top:6px; white-space:pre-wrap;">${escapeHTML(e.message)}</div>
        <div style="margin-top:10px; color:var(--muted);">
          対策：<br>
          1) シートを「ファイル → 共有 → ウェブに公開」でCSV公開<br>
          2) 1行目に <code>question, A, B, C, D, answer</code> があるか確認<br>
        </div>
        <div style="margin-top:12px;">
          <button onclick="location.reload()">再読み込み</button>
          <button onclick="(${showHome.toString()})()">クイズ選択へ戻る</button>
        </div>
      </div>
    `;
    console.error(e);
  }
}

/* =========================
  9) イベント
========================= */
backBtn.onclick = () => location.hash = ""; // homeへ
prevBtn.onclick = () => { idx = Math.max(0, idx-1); renderAll(); };
nextBtn.onclick = () => { idx = Math.min(questions.length-1, idx+1); renderAll(); };
markBtn.onclick = () => { reviewed[idx] = !reviewed[idx]; renderAll(); };
submitBtn.onclick = () => submit(false);
restartBtn.onclick = () => { if(confirm("出題セットを再生成して最初からやり直しますか？")) buildTest(); };

[timerToggle, minutesSelect].forEach(el => el.onchange = () => setupTimer());

/* =========================
  10) ルーティング（URLでクイズIDを指定可能）
     例: /quiz-site/#russia
========================= */
function onRoute(){
  const id = (location.hash || "").replace("#","").trim();
  if (!id) { showHome(); return; }
  renderHome();
  startQuiz(id);
}
renderHome();
onRoute();
window.addEventListener("hashchange", onRoute);
</script>
</body>
