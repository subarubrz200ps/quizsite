<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>クイズ選択 → 四択テスト</title>

<style>
:root{
  --bg:#ffffff;
  --bg2:#f6f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --accent:#2563eb;
  --good:#16a34a;
  --bad:#dc2626;
  --warn:#b45309;
  --line:rgba(17,24,39,.12);
  --chip:rgba(17,24,39,.04);
  --shadow:0 12px 24px rgba(17,24,39,.08);
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
}
.wrap{max-width:1100px;margin:0 auto;padding:20px;}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;}
h1{margin:0;font-size:22px;}
.meta{color:var(--muted);font-size:13px;}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:var(--shadow);
}
button{
  border:1px solid rgba(17,24,39,.14);
  background:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}
button.primary{
  background:rgba(37,99,235,.1);
  border-color:rgba(37,99,235,.35);
  color:var(--accent);
}
button.danger{
  background:rgba(220,38,38,.08);
  border-color:rgba(220,38,38,.35);
  color:var(--bad);
}
button:disabled{opacity:.5;cursor:not-allowed;}
select{padding:4px 6px;border-radius:8px;}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:800px){.grid{grid-template-columns:1fr;}}

.qcard{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;}
.qbody{padding:12px;display:flex;flex-direction:column;gap:8px;}
.qtitle{font-weight:900;}
.qdesc{font-size:13px;color:var(--muted);}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);}
.qactions{display:flex;gap:8px;}

#app{display:none;}
.layout{display:grid;grid-template-columns:1fr 320px;gap:12px;}
@media(max-width:900px){.layout{grid-template-columns:1fr;}}

.choice{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  display:flex;
  gap:8px;
  cursor:pointer;
}
.choice.correct{border-color:rgba(22,163,74,.45);background:rgba(22,163,74,.06);}
.choice.wrong{border-color:rgba(220,38,38,.45);background:rgba(220,38,38,.06);}
.choice.disabled{cursor:default;}
.badge{
  width:24px;height:24px;border-radius:8px;
  background:rgba(37,99,235,.12);
  display:grid;place-items:center;font-weight:800;
}
.hint{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#f9fafb;
  display:none;
  font-size:13px;
}
.navBtn{padding:6px;border-radius:8px;border:1px solid var(--line);}
.navBtn.current{background:rgba(37,99,235,.1);}
</style>
</head>

<body>
<div class="wrap">
<header>
  <h1 id="pageTitle">クイズを選択</h1>
  <div class="meta" id="meta">—</div>
</header>

<section id="home" class="card">
  <div class="grid" id="quizGrid"></div>
</section>

<section id="app">
<div class="layout">

<div class="card">
  <div class="meta" id="progress"></div>

  <div class="meta" style="margin-top:6px;">
    出題数 <select id="countSelect"><option>5</option><option selected>20</option><option value="all">全問</option></select>
    ／ 合格 <select id="passSelect"><option>60</option><option selected>80</option></select> %
  </div>

  <div id="question" style="margin:12px 0;font-size:18px;"></div>
  <div id="choices"></div>
  <div id="hint" class="hint"></div>

  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
    <button id="backBtn">← クイズ選択へ</button>
    <button id="prevBtn">前へ</button>
    <button class="primary" id="nextBtn">次へ</button>
    <button class="danger" id="submitBtn">提出</button>
  </div>

  <div id="result" style="display:none;margin-top:14px;"></div>
</div>

<div class="card">
  <div id="navGrid"></div>
</div>

</div>
</section>
</div>

<script>
const QUIZZES=[
  {
    id:"cb02",
    title:"消費者行動論 第2回",
    desc:"確認テスト",
    image:"assets/thumb_cb_02.png",
    csv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vSTZWe82RkSO44S1unqts1URF7bYW6mgscBA3h3Glf8yAiFe15JEZJ_ZXzblg0KGvw-OSpnBu_UG4ax/pub?output=csv"
  },
{
    id:"cb03",
    title:"消費者行動論 第3回",
    desc:"確認テスト",
    image:"assets/thumb_cb_03.png",
    csv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vStJ9jsNvlA0_kkQpMSvb_5wgGQl10swstNpZTyAqF_Ytb4cIMBE7aGH8Ola7hItPoa3iG90WyQs2m4/pub?output=csv"
  }];

const home=document.getElementById("home");
const app=document.getElementById("app");
const quizGrid=document.getElementById("quizGrid");
const questionEl=document.getElementById("question");
const choicesEl=document.getElementById("choices");
const hintEl=document.getElementById("hint");
const progressEl=document.getElementById("progress");
const navGrid=document.getElementById("navGrid");
const resultEl=document.getElementById("result");

let mode="test";
let bank=[],questions=[],answers=[],revealed=[];
let idx=0,submitted=false;

function renderHome(){
  quizGrid.innerHTML="";
  QUIZZES.forEach(q=>{
    const d=document.createElement("div");
    d.className="qcard";
    d.innerHTML=`
      <img class="thumb" src="${q.image}">
      <div class="qbody">
        <div class="qtitle">${q.title}</div>
        <div class="qdesc">${q.desc}</div>
        <div class="qactions">
          <button class="primary">テスト</button>
          <button>練習</button>
        </div>
      </div>`;
    d.querySelectorAll("button")[0].onclick=()=>startQuiz(q,"test");
    d.querySelectorAll("button")[1].onclick=()=>startQuiz(q,"practice");
    quizGrid.appendChild(d);
  });
}

async function startQuiz(q,selectedMode){
  mode=selectedMode;
  home.style.display="none";
  app.style.display="block";
  document.getElementById("pageTitle").textContent=q.title+(mode==="practice"?"（練習）":"");

  const csv=await fetch(q.csv).then(r=>r.text());
  bank=parseCSV(csv);
  questions=[...bank];
  answers=Array(questions.length).fill(null);
  revealed=Array(questions.length).fill(false);
  idx=0;submitted=false;
  renderAll();
}

function parseCSV(t){
  const l=t.trim().split("\n");
  const h=l.shift().split(",");
  const qi=h.indexOf("question");
  const ai=h.indexOf("answer");
  return l.map(r=>{
    const c=r.split(",");
    return{q:c[qi],choices:c.slice(qi+1,qi+5),correct:c[ai],exp:c[ai+1]};
  });
}

function renderAll(){
  progressEl.textContent=`Q${idx+1}/${questions.length}`;
  renderQuestion();renderNav();
}

function renderQuestion(){
  const q=questions[idx];
  questionEl.textContent=q.q;
  choicesEl.innerHTML="";
  hintEl.style.display="none";

  q.choices.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="choice";
    d.innerHTML=`<div class="badge">${String.fromCharCode(65+i)}</div>${t}`;
    if(revealed[idx]){
      d.classList.add("disabled");
      if(i===(q.correct.charCodeAt(0)-65)) d.classList.add("correct");
      if(answers[idx]===i && i!==(q.correct.charCodeAt(0)-65)) d.classList.add("wrong");
    }
    d.onclick=()=>{
      if(submitted||revealed[idx])return;
      answers[idx]=i;
      if(mode==="practice"){
        revealed[idx]=true;
        hintEl.textContent=(i===(q.correct.charCodeAt(0)-65)?"正解":"不正解")+"："+(q.exp||"");
        hintEl.style.display="block";
      }
      renderAll();
    };
    choicesEl.appendChild(d);
  });
}

function renderNav(){
  navGrid.innerHTML="";
  questions.forEach((_,i)=>{
    const b=document.createElement("button");
    b.className="navBtn"+(i===idx?" current":"");
    b.textContent=i+1;
    b.onclick=()=>{idx=i;renderAll();};
    navGrid.appendChild(b);
  });
}

document.getElementById("backBtn").onclick=()=>{
  app.style.display="none";
  home.style.display="block";
  renderHome();
};
document.getElementById("prevBtn").onclick=()=>{if(idx>0){idx--;renderAll();}};
document.getElementById("nextBtn").onclick=()=>{if(idx<questions.length-1){idx++;renderAll();}};
document.getElementById("submitBtn").onclick=()=>{
  submitted=true;
  let ok=0;
  questions.forEach((q,i)=>{if(answers[i]===(q.correct.charCodeAt(0)-65))ok++;});
  resultEl.style.display="block";
  resultEl.textContent=`結果：${ok}/${questions.length}`;
};

renderHome();
</script>
</body>
</html>
